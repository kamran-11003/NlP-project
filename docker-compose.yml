# PostgreSQL for the Olist data.   Start:  docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: voice-analyst-db
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: olist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d olist"]
      interval: 5s
      retries: 20
volumes:
  pgdata:
